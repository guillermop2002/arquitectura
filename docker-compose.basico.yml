version: '3.8'

services:
  basico-verification:
    build:
      context: .
      dockerfile: Dockerfile.basico
    container_name: basico-verification
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY_1=${GROQ_API_KEY_1}
      - GROQ_API_KEY_2=${GROQ_API_KEY_2}
      - GROQ_API_KEY_3=${GROQ_API_KEY_3}
      - GROQ_API_KEY_4=${GROQ_API_KEY_4}
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONPATH=/app
    volumes:
      - ./uploads:/app/uploads
      - ./sessions:/app/sessions
      - ./logs:/app/logs
      - ./temp:/app/temp
      - ./Normativa:/app/Normativa
      - ./frontend:/app/frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - basico-network
      - arquitectura_verificacion-network

  redis:
    image: redis:7-alpine
    container_name: basico-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - basico-network

volumes:
  redis_data:

networks:
  basico-network:
    driver: bridge
  arquitectura_verificacion-network:
    external: true
