<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Frontend con Logs Detallados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .log-container {
            background: #1e1e1e;
            color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            height: 400px;
            overflow-y: scroll;
            font-family: monospace;
            font-size: 12px;
        }
        .normative-item {
            border: 1px solid #ddd;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
        }
        .normative-item.exists {
            background-color: #d4edda;
            border-color: #28a745;
        }
        .normative-item.missing {
            background-color: #f8d7da;
            border-color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1>🔍 Test de Normativas con Logs Detallados</h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Configuración de Prueba</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="usoSelect" class="form-label">Uso Principal</label>
                            <select class="form-select" id="usoSelect">
                                <option value="">Seleccionar...</option>
                                <option value="residencial">Residencial</option>
                                <option value="industrial">Industrial</option>
                                <option value="garaje-aparcamiento">Garaje-Aparcamiento</option>
                                <option value="servicios_terciarios">Servicios Terciarios</option>
                                <option value="dotacional_transporte">Dotacional Transporte</option>
                                <option value="dotacional_deportivo">Dotacional Deportivo</option>
                                <option value="dotacional_equipamiento">Dotacional Equipamiento</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label for="zonaSelect" class="form-label">Norma Zonal</label>
                            <select class="form-select" id="zonaSelect">
                                <option value="">Seleccionar...</option>
                                <option value="nz1">NZ1</option>
                                <option value="nz2">NZ2</option>
                                <option value="nz3">NZ3</option>
                                <option value="nz4">NZ4</option>
                                <option value="nz5">NZ5</option>
                                <option value="nz6">NZ6</option>
                                <option value="nz7">NZ7</option>
                                <option value="nz8">NZ8</option>
                                <option value="nz9">NZ9</option>
                            </select>
                        </div>
                        
                        <button id="testBtn" class="btn btn-primary">🔍 Probar Normativas</button>
                        <button id="clearLogsBtn" class="btn btn-secondary">🧹 Limpiar Logs</button>
                    </div>
                </div>
                
                <div class="card mt-3">
                    <div class="card-header">
                        <h5>📋 Normativas Aplicables</h5>
                    </div>
                    <div class="card-body" id="normativesContainer">
                        <p class="text-muted">Selecciona uso y zona para ver las normativas</p>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>📊 Logs del Frontend</h5>
                    </div>
                    <div class="card-body">
                        <div id="logsContainer" class="log-container"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL = 'http://localhost:8001';
        let logContainer = document.getElementById('logsContainer');
        
        // Override console.log to show in our container
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        
        function addLog(message, type = 'log') {
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#ff6b6b' : type === 'warn' ? '#feca57' : '#48dbfb';
            logContainer.innerHTML += `<div style="color: ${color}">[${timestamp}] ${message}</div>`;
            logContainer.scrollTop = logContainer.scrollHeight;
            
            // Also log to real console
            if (type === 'error') originalError(message);
            else if (type === 'warn') originalWarn(message);
            else originalLog(message);
        }
        
        console.log = (message) => addLog(message, 'log');
        console.error = (message) => addLog(message, 'error');
        console.warn = (message) => addLog(message, 'warn');
        
        // Clear logs function
        document.getElementById('clearLogsBtn').addEventListener('click', () => {
            logContainer.innerHTML = '';
            console.log('🧹 Logs limpiados');
        });
        
        // Test function
        document.getElementById('testBtn').addEventListener('click', async () => {
            const uso = document.getElementById('usoSelect').value;
            const zona = document.getElementById('zonaSelect').value;
            
            console.log('🔍 INICIANDO TEST DE NORMATIVAS');
            console.log(`📋 Configuración: uso=${uso}, zona=${zona}`);
            
            if (!uso || !zona) {
                console.warn('⚠️  Falta seleccionar uso o zona');
                return;
            }
            
            const config = {
                uso_principal: uso,
                norma_zonal: zona,
                superficie_construida: 150,
                plantas: 2
            };
            
            console.log('📤 Enviando configuración:', JSON.stringify(config));
            
            try {
                const response = await fetch(`${BASE_URL}/basico/normatives/preview`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(config)
                });
                
                console.log(`📥 Respuesta del servidor: ${response.status} ${response.statusText}`);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log(`📊 Total normativas: ${data.total_normatives}`);
                    
                    // Display normatives
                    const container = document.getElementById('normativesContainer');
                    container.innerHTML = '';
                    
                    data.normatives.forEach((norm, index) => {
                        const status = norm.file_exists ? '✅' : '❌';
                        const cssClass = norm.file_exists ? 'exists' : 'missing';
                        
                        console.log(`${status} Normativa ${index + 1}: ${norm.name}`);
                        console.log(`   📁 Archivo: ${norm.file_path}`);
                        console.log(`   📝 Justificación: ${norm.justification}`);
                        console.log(`   🎯 Aplica a: ${norm.applies_to}`);
                        
                        const div = document.createElement('div');
                        div.className = `normative-item ${cssClass}`;
                        div.innerHTML = `
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <h6>${status} ${norm.name}</h6>
                                    <small class="text-muted">${norm.justification}</small><br>
                                    <small><strong>Archivo:</strong> ${norm.file_path}</small><br>
                                    <small><strong>Aplica a:</strong> ${norm.applies_to}</small>
                                </div>
                                <span class="badge ${norm.file_exists ? 'bg-success' : 'bg-danger'}">
                                    ${norm.file_exists ? 'EXISTE' : 'FALTA'}
                                </span>
                            </div>
                        `;
                        container.appendChild(div);
                    });
                    
                    console.log('✅ Test completado exitosamente');
                } else {
                    const errorText = await response.text();
                    console.error(`❌ Error del servidor: ${response.status} - ${errorText}`);
                }
            } catch (error) {
                console.error(`❌ Error de conexión: ${error.message}`);
            }
        });
        
        console.log('🚀 Frontend de test cargado');
        console.log('💡 INSTRUCCIONES:');
        console.log('1. Selecciona un uso y una zona');
        console.log('2. Haz clic en "Probar Normativas"');
        console.log('3. Observa los logs detallados aquí');
        console.log('4. Abre también las DevTools (F12) para ver logs adicionales');
    </script>
</body>
</html>
